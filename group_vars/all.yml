# 全ホスト共通変数
# このリポは公開。秘密値は置かない（SSM Parameter Store 等から実行時取得する）。

# 各種 AWS 操作のリージョン
aws_region: us-east-1

# 開発ユーザー名。このリポを特定の個人に紐付けないため汎用名にしている。
dev_user_name: human

# 開発ユーザーの authorized_keys を格納した SSM Parameter (String) の名前。
# 公開鍵そのものはこのリポに置かず、ここから取得する。
# 【契約】この名前は、インスタンスの IAM role に read 権限が付与された
# パラメータ名と一致させること。インフラ側で環境プレフィックス (例 dev) を
# 変える場合は、この値も同じプレフィックスに揃える必要がある。
authorized_keys_ssm_param: /dev/dev-server/authorized-keys

# dotfiles (chezmoi source) の公開リポ。chezmoi が clone/apply する。
dotfiles_repo_url: https://github.com/xande0812/dev-env-dotfiles.git

# chezmoi はプロビジョニング側のメタツール (mise 管理にはしない)。Ubuntu 26.04 の
# apt には無いため、GitHub release の .deb を version pin + sha256 で導入する。
# bump 時は version と sha256 を同時更新し diff レビューする。
chezmoi_version: "2.70.5"
chezmoi_deb_sha256: "3d006be5cad96688a8e3870cd79e87be2e93e85197014f0603bacb38c5c4f417"

# apt で入れる単純なシステム/CLI ユーティリティ。
# zsh プラグイン本体は apt、source は dotfiles 側の .zshrc が行う。
# mise 管理ツール (node/eza/starship/sheldon/...) は dotfiles の mise config が持つ。
apt_dev_packages:
  - zsh
  - zsh-autosuggestions
  - zsh-syntax-highlighting
  - tmux
  - htop
  - tree
  - wget
  - figlet
  - lolcat
  - httpie
  - build-essential   # neovim treesitter parser のコンパイル等 (gcc/make)
