# 全ホスト共通変数（EC2 / 自宅サーバ 両環境で共有する値のみ）
#
# 環境依存値 (aws_region / authorized_keys_ssm_param 等) は vars/env-<target_env>.yml、
# アーキテクチャ依存値 (chezmoi の sha256 等) は vars/arch-<ansible_architecture>.yml に
# 分離し、site.yml の pre_tasks で target_env を判定して include する。

# 開発ユーザー名。このリポを特定の個人に紐付けないため汎用名にしている。
dev_user_name: human

# システムのタイムゾーン。EC2 / 自宅とも OS 既定は UTC のため、log や date 表示を
# 日本時間に揃える。base role が timedatectl で冪等に適用する。
system_timezone: Asia/Tokyo

# egress proxy (squid) の有効/無効トグル。既定 true。
# 実験などで一時的に egress 制御を外して素通し (直出) にしたいときに false にする
# (group_vars をこの値にして ansible-pull 再実行、または one-shot で
#  `-e squid_enabled=false`)。false のとき site.yml は:
#   - squid role を skip する (install/config/起動・透過 redirect の再適用をしない)
#   - pre_tasks の redirect-clear が iptables の DEV_SQUID_OUTPUT chain を撤去
#     (role skip により再適用されないので off のまま残る)
#   - pre_tasks が squid / dev-egress-squid-redirect の service を stop + disable
#     (boot 時に redirect unit が squid を引き戻すのを防ぐ)
# true に戻して再実行すれば squid 運用に復旧する。
squid_enabled: false

# dotfiles (chezmoi source) の公開リポ。chezmoi が clone/apply する。
dotfiles_repo_url: https://github.com/xande0812/dev-env-dotfiles.git

# chezmoi はプロビジョニング側のメタツール (mise 管理にはしない)。Ubuntu の apt には
# 無いため、GitHub release の .deb を version pin + sha256 で導入する。version は両 arch
# 共通、sha256 は arch 依存なので vars/arch-*.yml が持つ。
# bump 時は version と両 arch の sha256 を同時更新し diff レビューする。
chezmoi_version: "2.70.5"

# apt で入れる単純なシステム/CLI ユーティリティ。
# zsh プラグイン本体は apt、source は dotfiles 側の .zshrc が行う。
# mise 管理ツール (node/eza/starship/sheldon/...) は dotfiles の mise config が持つ。
apt_dev_packages:
  - zsh
  - zsh-autosuggestions
  - zsh-syntax-highlighting
  - tmux
  - htop
  - tree
  - wget
  - figlet
  - lolcat
  - httpie
  - build-essential   # neovim treesitter parser のコンパイル等 (gcc/make)
