---
# chezmoi を導入し、公開 dotfiles リポを開発ユーザーのホームに適用する。
# dotfiles 本体・mise/sheldon の設定・mise install/sheldon lock の run スクリプトは
# すべて dotfiles リポ (chezmoi) 側にある。ansible は binary 導入と起動だけを担う。
# chezmoi は Ubuntu apt に無いため、GitHub release の .deb を pin + sha256 で導入。
# arch (amd64 / arm64) と sha256 は vars/arch-*.yml が持つ。
- name: Check installed chezmoi version
  ansible.builtin.command: chezmoi --version
  register: chezmoi_installed
  changed_when: false
  failed_when: false

- name: Install chezmoi from pinned .deb
  when: chezmoi_version not in (chezmoi_installed.stdout | default(''))
  block:
    - name: Download chezmoi .deb (pinned + checksum)
      ansible.builtin.get_url:
        url: "https://github.com/twpayne/chezmoi/releases/download/v{{ chezmoi_version }}/chezmoi_{{ chezmoi_version }}_linux_{{ chezmoi_arch }}.deb"
        dest: "/tmp/chezmoi_{{ chezmoi_version }}_linux_{{ chezmoi_arch }}.deb"
        checksum: "sha256:{{ chezmoi_deb_sha256 }}"
        mode: '0644'

    - name: Install chezmoi .deb
      ansible.builtin.apt:
        deb: "/tmp/chezmoi_{{ chezmoi_version }}_linux_{{ chezmoi_arch }}.deb"

  always:
    - name: Remove chezmoi .deb installer
      ansible.builtin.file:
        path: "/tmp/chezmoi_{{ chezmoi_version }}_linux_{{ chezmoi_arch }}.deb"
        state: absent

# 初回のみ clone。以降は pull タスクで更新する。
- name: Initialize chezmoi from the dotfiles repo
  become: true
  become_user: "{{ dev_user_name }}"
  ansible.builtin.command:
    cmd: "chezmoi init {{ dotfiles_repo_url }}"
    creates: "/home/{{ dev_user_name }}/.local/share/chezmoi/.git"
  environment:
    HOME: "/home/{{ dev_user_name }}"

- name: Check chezmoi source origin URL
  become: true
  become_user: "{{ dev_user_name }}"
  ansible.builtin.command: chezmoi git -- remote get-url origin
  environment:
    HOME: "/home/{{ dev_user_name }}"
  register: chezmoi_origin_url
  changed_when: false

- name: Ensure chezmoi source origin uses the configured public URL
  become: true
  become_user: "{{ dev_user_name }}"
  ansible.builtin.command:
    argv:
      - chezmoi
      - git
      - --
      - remote
      - set-url
      - origin
      - "{{ dotfiles_repo_url }}"
  environment:
    HOME: "/home/{{ dev_user_name }}"
  when: chezmoi_origin_url.stdout != dotfiles_repo_url

- name: Check chezmoi source worktree status
  become: true
  become_user: "{{ dev_user_name }}"
  ansible.builtin.command: chezmoi git -- status --porcelain
  environment:
    HOME: "/home/{{ dev_user_name }}"
  register: chezmoi_git_status
  changed_when: false

- name: Refuse to pull dotfiles with local source changes
  ansible.builtin.assert:
    that:
      - chezmoi_git_status.stdout == ""
    fail_msg: >-
      /home/{{ dev_user_name }}/.local/share/chezmoi に未 commit の変更があります。
      対象ホスト上で
      `sudo -u {{ dev_user_name }} HOME=/home/{{ dev_user_name }} chezmoi git -- status --short`
      と
      `sudo -u {{ dev_user_name }} HOME=/home/{{ dev_user_name }} chezmoi git -- diff --stat`
      を確認し、必要なら dotfiles repo に commit/push するか、不要なら破棄してから
      ansible-pull を再実行してください。

- name: Pull latest dotfiles
  become: true
  become_user: "{{ dev_user_name }}"
  ansible.builtin.command: chezmoi git -- -c pull.rebase=false pull --ff-only
  environment:
    HOME: "/home/{{ dev_user_name }}"
  register: chezmoi_pull
  changed_when: "'Already up to date' not in chezmoi_pull.stdout"

# apply は chezmoi が内部で冪等。run_onchange スクリプト (mise install / sheldon
# lock) は対象設定が変わったときだけ再実行される。
- name: Apply dotfiles
  become: true
  become_user: "{{ dev_user_name }}"
  ansible.builtin.command: chezmoi apply --force
  environment:
    HOME: "/home/{{ dev_user_name }}"
  changed_when: false
