---
# Obsidian CLI は Obsidian Desktop に同梱されるため、playbook では GUI 本体を
# pinned .deb として導入する。CLI の有効化と ~/.local/bin/obsidian への登録は
# Obsidian の Settings -> General -> Command line interface で行う。
- name: Check installed Obsidian package version
  ansible.builtin.command:
    argv:
      - dpkg-query
      - -W
      - -f=${Version}
      - obsidian
  register: obsidian_installed
  changed_when: false
  failed_when: false

- name: Install Obsidian from pinned .deb
  when: obsidian_installed.stdout | default('') != obsidian_version
  block:
    - name: Download Obsidian .deb (pinned + checksum)
      ansible.builtin.get_url:
        url: "https://github.com/obsidianmd/obsidian-releases/releases/download/v{{ obsidian_version }}/obsidian_{{ obsidian_version }}_{{ obsidian_deb_arch }}.deb"
        dest: "/tmp/obsidian_{{ obsidian_version }}_{{ obsidian_deb_arch }}.deb"
        checksum: "sha256:{{ obsidian_deb_sha256 }}"
        mode: '0644'

    - name: Install Obsidian .deb
      ansible.builtin.apt:
        deb: "/tmp/obsidian_{{ obsidian_version }}_{{ obsidian_deb_arch }}.deb"

  always:
    - name: Remove Obsidian .deb installer
      ansible.builtin.file:
        path: "/tmp/obsidian_{{ obsidian_version }}_{{ obsidian_deb_arch }}.deb"
        state: absent
