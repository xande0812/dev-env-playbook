---
# apt で入る単純なユーティリティ。
- name: Install apt dev/utility packages
  ansible.builtin.apt:
    name: "{{ apt_dev_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  environment:
    DEBIAN_FRONTEND: noninteractive

# 開発ユーザーのログインシェルを zsh にする (zsh は上の apt で導入済み)。
- name: Set the dev user's login shell to zsh
  ansible.builtin.user:
    name: "{{ dev_user_name }}"
    shell: /usr/bin/zsh

# --- mise 本体 (apt repo 経由で auditable に導入) ----------------------------
# mise のグローバル設定 (config.toml) と tool install は chezmoi 側で管理する
# (run_onchange スクリプトで mise install する)。ここでは binary だけ入れる。
- name: Ensure apt keyrings dir
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Add mise GPG key
  ansible.builtin.get_url:
    url: https://mise.jdx.dev/gpg-key.pub
    dest: /etc/apt/keyrings/mise.asc
    owner: root
    group: root
    mode: '0644'

- name: Add mise apt repository
  ansible.builtin.deb822_repository:
    name: mise
    types: [deb]
    uris: https://mise.jdx.dev/deb
    suites: stable
    components: [main]
    architectures: [arm64]
    signed_by: /etc/apt/keyrings/mise.asc
    state: present

- name: Install mise
  ansible.builtin.apt:
    name: mise
    state: present
    update_cache: true
  environment:
    DEBIAN_FRONTEND: noninteractive
