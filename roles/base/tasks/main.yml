---
# システムのタイムゾーンを system_timezone (既定 Asia/Tokyo) に揃える。
# base role は ansible.builtin で統一しており community collection を入れないため、
# timezone module は使わず timedatectl で設定する。現在値を読んで差分時のみ適用し冪等化する。
- name: Check current system timezone
  ansible.builtin.command: timedatectl show --property=Timezone --value
  register: current_timezone
  changed_when: false

- name: Set system timezone to {{ system_timezone }}
  ansible.builtin.command: timedatectl set-timezone {{ system_timezone }}
  when: current_timezone.stdout != system_timezone
  changed_when: true

# 基本パッケージと AWS CLI v2 を導入する。
- name: Install base packages
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
      - gnupg
      - sudo
      - unzip
      - jq
      - git
      - bubblewrap
      - apparmor-utils
    state: present
    update_cache: true
    cache_valid_time: 3600
  environment:
    DEBIAN_FRONTEND: noninteractive

# Ubuntu 既定の awscli は v1 系で古いため、公式 v2 を入れる。
# arch は vars/arch-*.yml の aws_cli_arch (x86_64 / aarch64)。agent の aws-ro 確認で
# 自宅でも使うため、EC2 / home 両方で導入する。
- name: Check whether aws CLI is present
  ansible.builtin.command: aws --version
  register: aws_version_check
  changed_when: false
  failed_when: false

- name: Install AWS CLI v2 ({{ aws_cli_arch }})
  when: aws_version_check.rc != 0
  block:
    - name: Download AWS CLI v2 installer
      ansible.builtin.get_url:
        url: "https://awscli.amazonaws.com/awscli-exe-linux-{{ aws_cli_arch }}.zip"
        dest: /tmp/awscliv2.zip
        mode: '0644'

    - name: Unpack AWS CLI v2 installer
      ansible.builtin.unarchive:
        src: /tmp/awscliv2.zip
        dest: /tmp
        remote_src: true

    - name: Run AWS CLI v2 installer
      ansible.builtin.command: /tmp/aws/install --update
      changed_when: true

  always:
    - name: Clean up AWS CLI installer artifacts
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/awscliv2.zip
        - /tmp/aws
