PasswordAuthentication no
PermitRootLogin no
PubkeyAuthentication yes
KbdInteractiveAuthentication no

# laptop → 対象ホストへ secret を session 限定 env で forward するための受け口。
# 長期 secret はホストのディスクに置かず、`SendEnv` (laptop) + `AcceptEnv` (この行)
# のペアで session scope の env としてのみ存在させる。
AcceptEnv ANTHROPIC_API_KEY
AcceptEnv AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN
AcceptEnv AWS_DEFAULT_REGION AWS_REGION AWS_PROFILE
# sshd の AcceptEnv glob は suffix 無しの素の名前にはマッチしないため両方明示する。
# `DOTENV_PRIVATE_KEY*` (アンダースコア無し) への「整理」は `DOTENV_PRIVATE_KEYS` 等の
# typo 名まで拾うリスクがあるので避けること。
AcceptEnv DOTENV_PRIVATE_KEY DOTENV_PRIVATE_KEY_*
