# dev-server 環境構築 playbook (ansible-pull / localhost)
#
# 対象ホスト上で `ansible-pull` により localhost に適用される。
# system roles を順に適用する。user roles は順次追加予定。
- name: dev-server environment (pull / localhost)
  hosts: localhost
  connection: local
  become: true
  gather_facts: true
  roles:
    - base            # apt 基本パッケージ + AWS CLI v2
    - sshd_hardening  # sshd の公開鍵認証強制 + AcceptEnv
    - apparmor_bwrap  # bwrap に userns を許可する AppArmor profile
    - squid           # egress proxy (SNI allowlist)
    - dev_user        # 開発ユーザー作成 + authorized_keys (SSM 経由)
    - dev_tools       # apt ユーティリティ + mise + グローバル開発ツール
