# dev-env-playbook (ansible-pull / localhost)
#
# このリポは dev-server EC2 上で `ansible-pull` により localhost に適用される。
# 制御ノード (laptop) では ansible を動かさない。インスタンス上の apt 版 ansible
# (Ubuntu の安定 python) で実行するため、macOS 固有の fork/Python 問題は発生しない。
[defaults]
inventory = inventory/hosts
retry_files_enabled = False
stdout_callback = default
result_format = yaml
# localhost 適用では SSH host key の概念が無い
host_key_checking = False
# python interpreter discovery の警告を抑制（対象は Ubuntu の system python 固定）
interpreter_python = auto_silent
